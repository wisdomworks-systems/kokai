<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>カレンダーの表示許可</title>
<!--
  社内システムの画面が、利用者本人の Google カレンダーを読むための小さなページです。

  ・ボタンを押した本人の通行証だけを扱います
  ・求める権限は カレンダーの閲覧（calendar.readonly）のみです
  ・カレンダーにもどこにも、書き込みは行いません
  ・受け取った通行証は、呼び出し元の画面にだけ渡します
  ・このページは何も保存しません

  お問い合わせ： 株式会社ウィズダムワークス
-->
<style>
  :root{
    --ji:#1f2328; --usu:#57606a; --waku:#d0d7de; --ao:#0969da;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ji:#e6edf3; --usu:#9198a1; --waku:#3d444d; --ao:#4493f8;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:transparent;color:var(--ji);
    font:13px/1.5 -apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif}
  .naka{display:flex;align-items:center;gap:8px;padding:4px}
  button{font:inherit;padding:6px 14px;border-radius:6px;border:1px solid var(--waku);
    background:var(--ao);color:#fff;cursor:pointer;white-space:nowrap}
  button:disabled{opacity:.5;cursor:default}
  .ji{color:var(--usu);font-size:12px}
</style>
</head>
<body>
<div class="naka">
  <button id="btn">カレンダーを表示</button>
  <span class="ji" id="ji"></span>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* 発行元ID（公開されるもの） */
var CID = '797669684444-5ffbdm9ltqblqj0dt1a4d1r5n0fv3bfm.apps.googleusercontent.com';
/* 閲覧のみ。書き込みの権限は求めない */
var SCOPE = 'https://www.googleapis.com/auth/calendar.readonly';

/* 通行証を渡してよい呼び出し元 */
function oyaOk(o){
  return /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(o)
      || /^http:\/\/localhost(:\d+)?$/.test(o);
}

var oya = null, tc = null;
var btn = document.getElementById('btn');
var ji  = document.getElementById('ji');

function okuru(m){ if (oya) { try { parent.postMessage(m, oya); } catch (x) {} } }
function kaku(s){ ji.textContent = s || ''; }

window.addEventListener('message', function (e) {
  if (!e.data || e.data.wb !== 'cal-hello') return;
  if (!oyaOk(e.origin)) return;
  oya = e.origin;
  okuru({ wb: 'cal-ready' });
});

function tcYoi(){
  if (tc) return true;
  if (!(window.google && google.accounts && google.accounts.oauth2)) return false;
  tc = google.accounts.oauth2.initTokenClient({
    client_id: CID,
    scope: SCOPE,
    callback: function (r) {
      btn.disabled = false;
      if (r && r.access_token) {
        kaku('');
        okuru({ wb: 'cal-token', token: r.access_token,
                expiresIn: Number(r.expires_in || 3500) });
      } else {
        kaku('もう一度お願いします');
        okuru({ wb: 'cal-error', kind: 'no-token', message: '' });
      }
    },
    error_callback: function (e2) {
      btn.disabled = false;
      var t = (e2 && e2.type) || '?';
      kaku(t === 'popup_closed' ? 'もう一度お願いします' : '取れませんでした');
      okuru({ wb: 'cal-error', kind: t, message: (e2 && e2.message) || '' });
    }
  });
  return true;
}

btn.onclick = function () {
  if (!tcYoi()) { kaku('少し待ってからもう一度'); return; }
  btn.disabled = true;
  kaku('聞いています…');
  try { tc.requestAccessToken({ prompt: '' }); }
  catch (x) { btn.disabled = false; kaku('取れませんでした'); }
};

(function matsu(){
  var n = 0;
  var t = setInterval(function () {
    if (tcYoi()) { clearInterval(t); }
    else if (++n > 60) { clearInterval(t); kaku('Google の部品を読み込めません'); }
  }, 150);
})();
</script>
</body>
</html>
